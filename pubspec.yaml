name: crm
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages (you already had)
  cloud_firestore: ^6.1.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2

  # State management
  provider: ^6.1.5+1
  google_sign_in: ^6.0.0

  # UI helpers
  google_fonts: ^6.3.2
  flutter_svg: ^2.0.7

  # Utility
  uuid: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/illustration.png
    - assets/google_logo.png
    - assets/signup_art.png
